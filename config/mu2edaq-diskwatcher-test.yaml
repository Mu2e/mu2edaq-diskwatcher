# mu2edaq-diskwatcher.yaml — mu2edaq disk watcher configuration
#
# Values in the "watcher" section are defaults.  Any setting can be overridden
# by an environment variable (MU2EDAQ_DISKWATCHER_WEB_PORT=8080) and then by a
# command-line flag (--port 8080), in that order of increasing priority:
#
#     command line  >  environment  >  this file  >  built-in defaults
#
# If this file is absent, the built-in defaults are used.
#
# Three independent things can be monitored per entry:
#
#   delay:   staleness — alarm if the path has not been modified recently
#   space:   free space on a directory's filesystem  (paths: entries only)
#   size:    the size of a file                      (files: entries only)
#
# Each appears on its own dashboard page: /, /space and /sizes.

watcher:
  web_host:      "0.0.0.0"   # Bind address for the Flask web server
  web_port:      5002        # HTTP port for the dashboard
  poll_interval: 30          # Seconds between checks
  default_delay: 300         # Staleness threshold for entries that omit "delay"
  daemon:        false       # Set to true to run as a background daemon (POSIX only)
  pid_file:      "./config/mu2edaq-diskwatcher.pid"   # PID file written when daemon: true
  log_file:      "./config/mu2edaq-diskwatcher.log"   # Log file written when daemon: true


# ---------------------------------------------------------------------------
# Threshold syntax  (used by both "space:" and "size:")
# ---------------------------------------------------------------------------
# Sizes accept SI or IEC units, case-insensitively.  A bare number means bytes.
#
#     SI (powers of 1000):   500KB   2MB   1.5GB   4TB   3PB
#     IEC (powers of 1024):  500KiB  2MiB  1.5GiB  4TiB  3PiB
#     bytes:                 1048576
#
# Percentages ("10%") are accepted by "space:" only, and mean *percent of total
# capacity still free* — a file has no total capacity, so a percentage in a
# "size:" block is rejected (the other thresholds in that block still apply).
#
# The dashboards always display IEC units, so a "2TB" threshold is shown as
# "1.8 TiB".  That is the same number, written the other way round.


# ---------------------------------------------------------------------------
# Individual files to watch
# ---------------------------------------------------------------------------
# Each entry needs a "path".  Everything else is optional:
#
#   delay:  staleness threshold in seconds.  Omit it (and give a "size:" block)
#           to monitor size only; set it to null to list the file without
#           monitoring anything.  When both are omitted, watcher.default_delay
#           applies.
#   label:  shown in the dashboard instead of the raw path
#   size:   enables the File Sizes page for this entry
#   ssh:    read the file on a remote host (see the block further down)
#
# Size states, from best to worst:
#
#   GOOD      below every threshold
#   EMPTY     zero length — an alarm on its own, checked before any threshold
#   WARNING   size >= warning
#   CRITICAL  size >= critical
#   FULL      size >= full         ("max:" is accepted as a synonym for "full:")
#   MISSING   the file could not be read
#
# Size thresholds ascend: warning < critical < full.
files:
  - path:  /tmp/diskwatcher-example.txt  # Example stale file
    delay: 60          # flag as stale if not written within 1 minute
    label: "Example file (tmp)"

  - path:  /var/log/system.log  # Example updating file
    delay: 3600        # flag as stale if not written within 1 hour
    label: "System log"
    size:
      warning:  "500 MiB"
      critical: "2 GiB"
      full:     "8 GiB"

  - path:  /home/mu2edaq/myfile.txt  # Example of remote file
    delay: 600         # flag as stale if not written within 10 minutes
    label: "Example Remote File"
    ssh:
      host: mu2edaq@mu2edaq13.fnal.gov

  - path:  /Users/anorman/data/latest.dat  # Example of local file
    delay: 300         # flag as stale if not written within 5 minutes
    label: "Latest data (local)"

  # Alarm only if the file is zero length — no growth thresholds at all.
  #- path:  /data/mu2e/run_latest.dat
  #  label: "Latest run data"
  #  size:
  #    allow_empty: false     # this is the default; shown here for clarity

  # A file that is legitimately empty most of the time.
  #- path:  /var/spool/mu2e/errors.log
  #  label: "Error spool"
  #  size:
  #    allow_empty: true      # do not alarm on zero length
  #    warning:  "1 MiB"      # but do alarm once errors start piling up
  #    critical: "10 MiB"

  # Remote file accessed via SSH.  The "ssh" block is optional; omit it for
  # local paths.  All ssh sub-keys except "host" are optional.
  #- path:  /data/mu2e/run_latest.dat
  #  delay: 120
  #  label: "Latest run data (remote)"
  #  ssh:
  #    host:    daq-node01.example.com   # required — remote hostname or IP
  #    port:    22                        # SSH port (default: 22)
  #    key:     ~/.ssh/id_ed25519        # private key file (default: SSH agent / ~/.ssh/id_rsa)
  #    timeout: 10                        # connection+command timeout in seconds (default: 10)
  #    options:                           # extra ssh -o Key=Value pairs
  #      - StrictHostKeyChecking=no


# ---------------------------------------------------------------------------
# Directories to watch
# ---------------------------------------------------------------------------
# The mtime of a directory changes when files are added or removed.  To detect
# writes to files *inside* the directory, list those files individually in the
# "files" section above.
#
# A "space:" block enables free-space monitoring on the filesystem holding the
# directory.  Thresholds name how much space must remain FREE, so they descend:
#
#   GOOD      free space above every threshold
#   WARNING   free <= warning
#   CRITICAL  free <= critical
#   FULL      free <= full
#   MISSING   the directory could not be read
#   UNKNOWN   the directory exists but the filesystem could not be measured
#
# Space thresholds descend: warning > critical > full.
paths:
  - path:  /tmp
    delay: 600                        # flag as stale if unchanged for 10 minutes
    label: "Temp directory"
    space:
      warning:  "20%"                 # percent of capacity still free
      critical: "5%"
      full:     "1 GiB"               # absolute and percent may be mixed

  - path: /Users/anorman/data         # Should be a missing dir
    delay: 300
    label: "Main Data directory"

  # Remote directory accessed via SSH.
  - path:  /home
    delay: 600
    label: "NFS Home on MGR-01"
    ssh:
      host:    mu2edaq@mu2e-mgr-01.fnal.gov
  #    key:     ~/.ssh/id_ed25519
  #    timeout: 15
    space:
       warning: "20%"
       critical: "5%"
       full: "1 GB"

  # Remote directory accessed via SSH.
  - path:  /daqlogs
    delay: 600
    label: "/daqlogs on MGR-01"
    ssh:
      host:    mu2edaq@mu2e-mgr-01.fnal.gov
    space:
       warning: "20%"
       critical: "5%"
       full: "1 GB"

  # Remote directory accessed via SSH.
  - path:  /scratch
    delay: 600
    label: "/scratch on MGR-01"
    ssh:
      host:    mu2edaq@mu2e-mgr-01.fnal.gov
    space:
       warning: "20%"
       critical: "5%"
       full: "1 GB"

  # Remote directory accessed via SSH.
  - path:  /mongologs
    delay: 600
    label: "MongoDB Logs (dcs-01)"
    ssh:
      host:    mu2edcs@mu2e-dcs-01.fnal.gov
    space:
       warning: "20%"
       critical: "5%"
       full: "1 GB"

  # Remote directory accessed via SSH.
  - path:  /mongologs
    delay: 600
    label: "MongoDB Logs (dcs-02)"
    ssh:
      host:    mu2edcs@mu2e-dcs-02.fnal.gov
    space:
       warning: "20%"
       critical: "5%"
       full: "1%"

  # Remote directory accessed via SSH.
  - path:  /pgdata
    delay: 600
    label: "Postgress Data (dcs-01)"
    ssh:
      host:    mu2edcs@mu2e-dcs-01.fnal.gov
    space:
       warning: "20%"
       critical: "5%"
       full: "1%"

  # Remote directory accessed via SSH.
  - path:  /pgdata
    delay: 600
    label: "Postgress Data (dcs-02)"
    ssh:
      host:    mu2edcs@mu2e-dcs-02.fnal.gov
    space:
       warning: "20%"
       critical: "5%"
       full: "1%"


  # A volume watched for free space only — no staleness alarm.  Omitting
  # "delay" when a "space:" block is present disables staleness monitoring for
  # this entry; it is shown as "unmonitored" on the Watcher page.
