schema: mega-review/1
package: mu2edaq-diskwatcher
tier: A
group: monitoring
repo:
  url: git@github.com:Mu2e/mu2edaq-diskwatcher.git
  exists: true
  issues_enabled: true
doc_dir: docs
summary: >
  Measure-only monitor of file mtime freshness, filesystem free space and file
  sizes, serving three dashboards and a JSON API on port 5002, with one-hop
  HTTP federation across the DAQ node fleet
languages: [python, shell, javascript]
loc: 9555

runtime:
  executables:
    - name: mu2edaq-diskwatcher
      kind: daemon
      man_page: man/man1/mu2edaq-diskwatcher.1
    - name: diskwatcher.py
      kind: script
      waiver: >
        Source-checkout shim that inserts src/ on sys.path and calls
        cli:main (diskwatcher.py:19). Same interface as the console script;
        documented under SYNOPSIS in man/man1/mu2edaq-diskwatcher.1 rather
        than given a page of its own.
    - name: start-mu2edaq-diskwatcher.sh
      kind: script
      waiver: >
        Documented in the START AND STOP SCRIPTS section of
        man/man1/mu2edaq-diskwatcher.1:588, which covers both scripts,
        their options and their per-node pid/log placement.
    - name: stop-mu2edaq-diskwatcher.sh
      kind: script
      waiver: >
        Documented in the START AND STOP SCRIPTS section of
        man/man1/mu2edaq-diskwatcher.1:588.
    - name: bootstrap_diskwatcher.sh
      kind: script
      waiver: >
        Three-step venv bootstrap with no options; covered by README.md
        Quick start. Its non-conforming name is finding DW-006.
    - name: tools/diskwatcher-fleet.sh
      kind: script
      man_page: man/man1/diskwatcher-fleet.1
    - name: tools/make-node-configs.sh
      kind: script
      man_page: man/man1/make-node-configs.1
    - name: mu2edaq_diskwatcher
      kind: library
      waiver: >
        Importable package, but it exposes no stable API for other packages:
        nothing in the suite imports it, and the inter-instance contract is
        HTTP (/api/state), documented in docs/INTERFACES.md. No man3 page.
  services: []
  ports:
    - {port: 5002, proto: tcp, role: web-ui, source: "src/mu2edaq_diskwatcher/settings.py:137"}
    - {port: 5002, proto: tcp, role: json-api, source: "src/mu2edaq_diskwatcher/web/api.py:51"}
    - {port: 28999, proto: udp, role: service-discovery, source: "src/mu2edaq_diskwatcher/discovery.py:23"}
  config_files:
    - config/mu2edaq-diskwatcher.yaml
    - config/mu2e-diskwatcher-mgr-01.yaml
    - config/mu2e-diskwatcher-dl-01.yaml
    - config/nodes/node.template.yaml
    - config/nodes/aggregator.template.yaml
  env_vars:
    - MU2EDAQ_DISKWATCHER_CONFIG
    - MU2EDAQ_DISKWATCHER_WEB_HOST
    - MU2EDAQ_DISKWATCHER_WEB_PORT
    - MU2EDAQ_DISKWATCHER_POLL_INTERVAL
    - MU2EDAQ_DISKWATCHER_DEFAULT_DELAY
    - MU2EDAQ_DISKWATCHER_DAEMON
    - MU2EDAQ_DISKWATCHER_PID_FILE
    - MU2EDAQ_DISKWATCHER_LOG_FILE
    - MU2EDAQ_DISKWATCHER_RUN_DIR
    - MU2EDAQ_DISKWATCHER_VERBOSE
    - MU2EDAQ_DISKWATCHER_PEERS
    - MU2EDAQ_DISKWATCHER_PEER_TIMEOUT
    - MU2EDAQ_DISKWATCHER_PEER_INTERVAL
    - MU2EDAQ_DISKWATCHER_DISCOVER_PEERS
    - MU2EDAQ_DISKWATCHER_DISCOVER_FILTER
    - CRS_PORT_HTTP
    - CRS_STOP_TIMEOUT
    - DW_RUN_DIR

interactions:
  depends_on:
    - package: mu2edaq-discovery
      via: import
      direction: out
      optional: true
      evidence: "src/mu2edaq_diskwatcher/discovery.py:21"
    - package: mu2edaq-discovery
      via: import
      direction: out
      optional: true
      evidence: "src/mu2edaq_diskwatcher/peers.py:183"
    - package: mu2edaq-discovery
      via: udp
      direction: out
      optional: true
      evidence: "src/mu2edaq_diskwatcher/peers.py:197"
    - package: mu2edaq-diskwatcher
      via: http
      direction: out
      evidence: "src/mu2edaq_diskwatcher/peers.py:50"
    - package: mu2edaq-operations
      via: subprocess
      direction: in
      evidence: "start-mu2edaq-diskwatcher.sh:26"
  depended_on_by: []
  external: [ssh, flask, pyyaml]

quality:
  tests: {present: true, framework: pytest, count: 314}
  ci: {present: false, workflows: []}
  license: MIT
  artifacts_clean: false   # config/mu2edaq-diskwatcher.log — finding DW-001

