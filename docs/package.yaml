  - id: DW-008
    severity: S4
    type: documentation
    title: "[docs] clock skew between watcher and remote/peer hosts is unhandled and unmentioned"
    issue: "pending"
    fingerprint: 40e2927f

notes:
  issue_filing: >
    gh issue create against Mu2e/mu2edaq-diskwatcher was denied by this
    environment's permission policy. One attempt was made and not retried, per
    the review contract. All eight findings are staged in
    docs/ISSUES-PENDING.md in the exact §6 body format with fingerprints.
  dedup: >
    Dedup ran against the full issue list (4 issues: #7, #6 open; #2, #1
    closed) before any filing attempt. No fingerprint collision. Judgement
    call recorded: DW-006 (bootstrap script naming) shares the token
    "bootstrap_diskwatcher.sh" with open issue #7, which covers different
    defects in the same file (not location-independent, false success
    reporting). Filed as distinct because the defect and the fix differ; the
    staged body cross-references #7 and notes a maintainer may prefer to fold
    them into a comment.
  man_layout: >
    Four pages were git mv'd from a flat man/ into man/man1/ and man/man5/ per
    contract §4, and their .TH lines normalised to the fixed header format
    (ISO date, "Mu2e DAQ Manual"). All four pass mandoc -T lint with no ERROR
    or UNSUPP and groff -t -mandoc -Tutf8 -ww -z with no stderr. Section
    numbers match their directories. Note the conf.5 page contains a tbl table
    (.TS at line 244) and must be rendered with groff -t; without the tbl
    preprocessor groff emits a TW-register warning. man(1) invokes tbl
    automatically, so this affects only direct groff invocations.
    tests/test_packaging.py:30 reads man/<page> and will need its path updated
    to man/man1/ and man/man5/ — flagged rather than changed, because editing
    a test is a code change the contract forbids.
  node_configs: >
    All 27 files in config/nodes/ were re-rendered from node.template.yaml and
    compared byte-for-byte against what is committed. Zero drift. The
    aggregator's 28 static peers and 28 probe hosts are generated from the same
    loop (tools/make-node-configs.sh:126-131) and cannot diverge from each
    other.
  topology: >
    diskwatcher's node list (14 trk, 8 calo, 28 MC-2 hosts) is a strict subset
    of both mu2edaq-operations/scripts/nodes_config.yaml (18 trk, 14 calo, 47
    hosts) and mu2edaq-power-recovery/config/topology.yaml (18/14/48). It
    invents no host the others lack, but 19 MC-2 hosts and the entire HEERC
    test stand are uncovered. A fourth number exists in
    mu2edaq-power-recovery/config/power-sequence.yaml (14 trk, 11 calo), which
    matches neither. Filed as DW-003; nothing was changed, because whether the
    subset is deliberate scoping or staleness is not determinable from this
    repository.
  federation_verified: >
    The one-hop property is enforced in code, not convention. peers.py:50 fetches
    /api/state with no query string, and web/api.py:161 only appends peers/
    aggregate when _want_peers() reads a truthy ?peers= argument (api.py:83).
    A peer's peers are therefore structurally unreachable. Self-reference is
    separately refused by instance_id comparison (peers.py:135).
  submodule_state: >
    This submodule is ahead of its upstream and the superproject gitlink is
    stale. Pre-existing; not touched. Nothing was pushed.
